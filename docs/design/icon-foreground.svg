    <ellipse cx="254" cy="226" rx="38" ry="7" fill="#0b3f45" fill-opacity="0.2"/>
    <path d="M216 206c1-17 19-29 40-28s39 12 38 29-19 26-40 25-39-9-38-26z" fill="url(#s1)"/>
