<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>רגוע וחזק – foreground</title>
  <!-- Android adaptive-icon foreground: transparent background, all artwork inside the
       central 66% safe circle (center 256,256, r = 169). Pair with icon-background.svg
       or a solid #1a7f76 background layer. -->
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2f4f1"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbfa"/>
      <stop offset="1" stop-color="#cdebe6"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f6f3"/>
      <stop offset="1" stop-color="#b5e0d9"/>
