  </defs>

  <circle cx="256" cy="256" r="160" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5"/>
  <circle cx="256" cy="256" r="126" fill="#ffffff" fill-opacity="0.06"/>

